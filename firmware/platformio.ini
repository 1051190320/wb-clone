; wb-clone 显示端 — PlatformIO 配置
; 用法: pio run -t upload && pio device monitor
;
; 硬件按环境分区: 每个 env 用一行 `-I boards/<板型>` 选中该硬件的两份配置
;   boards/<板型>/tft_setup.h  -> TFT_eSPI 自动采用 (库内 __has_include 机制, 无需改库)
;   boards/<板型>/board.h      -> 固件侧的屏幕尺寸 / 旋转 / 背光引脚
; LVGL 配置 (lv_conf.h) 在 firmware/include/, 经 -I include + -DLV_CONF_INCLUDE_SIMPLE 生效

[env:esp32c3_gc9a01]
; 默认硬件: ESP32-C3 SuperMini + 1.28" GC9A01 圆屏 (240x240)
; USB: C3 原生 USB-Serial-JTAG (插 USB-C 即出现串口, Bridge 自动发现)
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1        ; 兼容 ESP32-C3 SuperMini 克隆板
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -I boards/esp32c3_gc9a01       ; 选中圆屏硬件配置
  -DARDUINO_USB_MODE=1           ; C3: 走原生 USB (USB-Serial-JTAG)
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I include                     ; lv_conf.h 所在目录
  -DLV_CONF_INCLUDE_SIMPLE       ; 强制 LVGL 使用项目 lv_conf.h
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.3.0

; ================= 备选硬件: 2.8 寸 CYD 黄板 (320x240 横屏) =================
[env:cyd_2_8]
; 硬件: ESP32-2432S028R (ESP32-WROOM-32 + ILI9341), USB 走 CH340
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -I boards/cyd_2_8              ; 选中 CYD 硬件配置
  -I include
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.3.0

; 新增板型步骤: 1) 建 boards/<板型>/ 放 tft_setup.h + board.h
;              2) 复制上面的 env 段, 改 -I boards/<板型> 与 board = ...
